# ==========================================================================
#  Nginx reverse proxy untuk Sistem Presensi Digital Sekolah
#  Simpan sebagai: /etc/nginx/sites-available/presensi
#  Aktifkan      : sudo ln -s /etc/nginx/sites-available/presensi /etc/nginx/sites-enabled/
#  Test & reload : sudo nginx -t && sudo systemctl reload nginx
#
#  GANTI: presensi.sekolahanda.sch.id  ->  domain atau IP publik VPS Anda
#  GANTI: /var/www/presensi            ->  lokasi folder project di VPS
# ==========================================================================

server {
    listen 80;
    listen [::]:80;

    server_name presensi.sekolahanda.sch.id;

    # Maksimal ukuran upload (foto siswa, ZIP foto massal, bukti izin)
    client_max_body_size 30M;

    # Info dasar
    access_log /var/log/nginx/presensi.access.log;
    error_log  /var/log/nginx/presensi.error.log;

    # --- Kompresi ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # --- File upload runtime (foto, logo, background, bukti izin) ---
    # Disajikan langsung oleh Nginx agar lebih cepat & tidak membebani Node.js
    location /uploads/ {
        alias /var/www/presensi/public/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --- Aset statis hasil build Next.js ---
    location /_next/static/ {
        alias /var/www/presensi/.next/static/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Semua request lain diteruskan ke aplikasi Next.js ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_cache_bypass                 $http_upgrade;

        # Timeout lebih longgar untuk proses import/export & laporan
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
